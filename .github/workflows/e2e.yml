name: E2E

# Two jobs:
#   typecheck — runs on every push / PR. Fast, no secrets, catches type errors early.
#   e2e       — runs the Playwright suite against the deployed test environment on a
#               nightly schedule and on manual dispatch.
# Configure repo secrets: TEST_BASE_URL, TEST_EMAIL, TEST_PASSWORD, ADMIN_API_KEY (optional).
# The unauth suite needs only TEST_BASE_URL; auth tests need the disposable account creds.

on:
  # `pull_request` covers branch work; a bare `push:` alongside it ran the
  # typecheck twice for every PR commit, so push is limited to main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    # Pinned: ubuntu-latest moved to 26.04 on 27.10.2026, where Playwright
    # cannot install Chromium, and the nightly stayed red unnoticed for a week.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check the suite
        run: npm run typecheck

  e2e:
    # The live suite needs the deployed env + secrets, so keep it off per-push runs.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Job-level env so steps inherit it and the `if` below can read env.* — the
    # `secrets` context is not available in `if` conditions.
    env:
      TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: deps
        run: npm ci

      - name: Verify TEST_BASE_URL is configured
        id: env
        # Without a base URL every page.goto('/') builds an invalid URL and the
        # whole suite fails with cryptic "Cannot navigate to invalid URL" errors.
        # Fail fast with a readable message instead.
        run: |
          if [ -z "$TEST_BASE_URL" ]; then
            echo "::error::TEST_BASE_URL secret is not set. Configure it in repo settings (e.g. https://test.memdecks.com)."
            exit 1
          fi
          echo "TEST_BASE_URL=$TEST_BASE_URL"

      - name: Install Playwright browser
        id: install
        # The log is kept so the failure alert can quote why the install broke.
        shell: bash
        run: mkdir -p ci-results && npx playwright install --with-deps chromium 2>&1 | tee ci-results/install.log

      # Each suite also writes a JSON report of its own: the failure alert reads
      # them to name the failed tests. One file per suite, because both runs
      # share Playwright's output folders and the second would overwrite the first.
      - name: Run safe suite (unauth + translation + onboarding + API)
        id: safe
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ci-results/safe.json
        run: npm run test:safe -- --reporter=html,json

      - name: Run authenticated suite
        id: auth
        # Only when the disposable account credentials are configured. `!cancelled()`
        # (not the implicit success()) so a safe-suite failure doesn't silently skip
        # the entire authenticated suite.
        if: ${{ !cancelled() && env.TEST_EMAIL != '' && env.TEST_PASSWORD != '' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ci-results/auth.json
        run: npm run test:auth -- --reporter=html,json

      - name: Tell Sergey in Telegram what failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node ci/notify-failure.mjs

      # Only a failed run keeps its report: each one is ~100 MB and the account has 0.5 GB of Actions storage.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
